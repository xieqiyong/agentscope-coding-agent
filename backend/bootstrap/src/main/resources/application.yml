spring:
  application:
    name: agent-platform

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/agent_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root123456

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # 开发阶段用 update 自动建表；稳定后建议切换到 Flyway/Liquibase。
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai

  sql:
    init:
      mode: never

server:
  port: 8081

spring.servlet.multipart:
  max-file-size: 20MB
  max-request-size: 25MB

agent:
  skill:
    # 导入的 Agent Skills zip 包解压存放目录
    store-dir: data/skills
  runtime:
    # 上下文压缩：ReAct 多轮累计输入超过阈值时，把较早历史用同模型压缩成摘要再送入
    context-compression:
      threshold-tokens: 16000
      keep-recent-messages: 8
    multi-agent:
      # 单张任务图的并行节点上限；所有任务图共享一个有界工作线程池。
      max-concurrency: 4
      worker-threads: 16
      queue-capacity: 128
    session:
      # AgentScope 内部 AgentState 存储。数据库仍然保存页面会话、消息和事件审计。
      enabled: true
      type: redis
      redis:
        uri: redis://666666@127.0.0.1:6379/0
      json:
        path: data/agentscope-sessions

logging:
  level:
    com.agentplatform: DEBUG
    org.hibernate.SQL: WARN
